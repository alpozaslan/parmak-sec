<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Herkes parmağını ekrana koyar — biri seçilir. Rastgele kazanan, takımlar veya sıra.">
<title>Parmak Seç</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b10'/%3E%3Ccircle cx='22' cy='24' r='9' fill='%23ff5470'/%3E%3Ccircle cx='43' cy='22' r='9' fill='%2336c5f0'/%3E%3Ccircle cx='32' cy='43' r='11' fill='%23ffd23f' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0b10; --fg: #f5f5f7; --muted: rgba(245,245,247,.6); --pill: rgba(255,255,255,.08); --pill-on: rgba(255,255,255,.92); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; gap: 10px;
    justify-content: center; flex-wrap: wrap; padding: 0 16px; transition: opacity .25s, transform .25s; z-index: 2; }
  body.busy header, body.busy #corner { opacity: 0; pointer-events: none; transform: translateY(-8px); }
  .pill { display: flex; align-items: center; background: var(--pill); border-radius: 999px; padding: 4px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .pill button { appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 15px;
    font-weight: 600; padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }
  .pill button[aria-checked="true"] { background: var(--pill-on); color: #111; }
  .pill button:focus-visible, #corner button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .stepper button { width: 38px; padding: 9px 0; font-size: 18px; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper span { min-width: 84px; text-align: center; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .stepper[hidden] { display: none; }

  #hint { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px;
    pointer-events: none; transition: opacity .3s; z-index: 1; }
  #hint h1 { margin: 0 0 10px; font-size: clamp(22px, 5vw, 34px); font-weight: 700; letter-spacing: -.01em; }
  #hint p { margin: 0; color: var(--muted); font-size: clamp(14px, 3.6vw, 17px); }
  #hint.off { opacity: 0; }
  .finger-icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5);
    animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.15); border-color: rgba(255,255,255,.9); } }
  #hint.hide-icon .finger-icon { display: none; }

  #corner { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right)); display: flex; gap: 8px;
    transition: opacity .25s, transform .25s; z-index: 2; }
  #corner button { appearance: none; border: 0; background: var(--pill); color: var(--fg); font: inherit; font-weight: 600;
    font-size: 14px; padding: 10px 16px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #corner button[aria-pressed="false"] { color: var(--muted); }
  #corner button[hidden] { display: none; }
  #tapHint { position: fixed; left: 0; right: 0; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); text-align: center;
    font-size: 15px; font-weight: 600; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.4);
    pointer-events: none; opacity: 0; transition: opacity .4s; z-index: 1; }
  #tapHint.show { opacity: 1; transition-delay: 1.2s; }
  @media (prefers-reduced-motion: reduce) { .finger-icon { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Dokunma alanı: her oyuncu parmağını buraya koyar"></canvas>

<header>
  <div class="pill" role="radiogroup" aria-label="Mod">
    <button role="radio" data-mode="winner">Kazanan</button>
    <button role="radio" data-mode="teams">Takımlar</button>
    <button role="radio" data-mode="order">Sıra</button>
  </div>
  <div class="pill stepper" id="stepper">
    <button id="minus" aria-label="Azalt">−</button>
    <span id="num" aria-live="polite">1 kazanan</span>
    <button id="plus" aria-label="Artır">+</button>
  </div>
</header>

<div id="hint">
  <div class="finger-icon"></div>
  <h1 id="hintTitle"></h1>
  <p id="hintSub"></p>
</div>

<div id="tapHint">Yeni tur için ekrana dokunun</div>

<div id="corner">
  <button id="snd" aria-pressed="true">Ses açık</button>
  <button id="vib" aria-pressed="true">Titreşim açık</button>
  <button id="clear" hidden>Temizle</button>
  <button id="fs" hidden aria-label="Tam ekranı aç/kapat">Tam ekran</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  const hint = $('#hint'), hintTitle = $('#hintTitle'), hintSub = $('#hintSub'), tapHint = $('#tapHint');

  // ---------- sizing ----------
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- settings ----------
  const HOLD = 500, COUNT = 2300, SPIN = 2100;   // stillness before ring, ring duration, spin duration (ms)
  const BEATS = [0, .28, .5, .65, .77, .86, .92, .96];  // heartbeat positions along the countdown, speeding up
  const clampInt = (v, a, b, d) => { v = Math.round(+v); return Number.isFinite(v) ? Math.min(b, Math.max(a, v)) : d; };
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem('fingerpick') || '{}') || {}; } catch { stored = {}; }
  const settings = {
    mode: ['winner', 'teams', 'order'].includes(stored.mode) ? stored.mode : 'winner',
    counts: { winner: clampInt(stored.counts?.winner, 1, 8, 1), teams: clampInt(stored.counts?.teams, 2, 8, 2) },
    sound: stored.sound !== false,
    haptics: stored.haptics !== false
  };
  const save = () => { try { localStorage.setItem('fingerpick', JSON.stringify(settings)); } catch {} };
  const count = () => settings.counts[settings.mode] ?? 1;
  const minFingers = () => settings.mode === 'winner' ? count() + 1 : settings.mode === 'teams' ? Math.max(2, count()) : 2;

  const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = n => Math.random() * n | 0;

  // ---------- sound ----------
  let ac = null, master = null;
  function audioInit() {
    if (!settings.sound) return;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC(); master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
    } catch {}
  }
  function tone(freq, dur = .08, type = 'square', vol = .25, when = 0, slideTo) {
    if (!settings.sound || !ac) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur = .4, vol = .3) {
    if (!settings.sound || !ac) return;
    const len = ac.sampleRate * dur | 0, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 2200; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  const sfx = {
    beat(p) { tone(110 + p * 70, .14, 'sine', .55, 0, 50); tone(220 + p * 140, .05, 'triangle', .18); },
    tick(i) { tone(620 + i * 45, .045, 'square', .1); },
    fanfare() {
      noise(.5, .3);
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { tone(f, .2, 'triangle', .3, i * .085); tone(f * 2, .12, 'square', .05, i * .085); });
      tone(1046.5, .7, 'triangle', .25, .34); tone(1318.5, .7, 'triangle', .18, .34); tone(1568, .7, 'sine', .12, .34);
    }
  };
  // ---------- vibration ----------
  // Android: Vibration API. iPhone Safari has no Vibration API, but on iOS 18+ toggling a
  // <input type="checkbox" switch> through its label plays a short system haptic tap.
  const canVibrate = typeof navigator.vibrate === 'function';
  let iosSwitch = null;
  if (!canVibrate) {
    iosSwitch = document.createElement('label');
    iosSwitch.setAttribute('aria-hidden', 'true');
    iosSwitch.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
    const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.tabIndex = -1;
    iosSwitch.appendChild(inp); document.body.appendChild(iosSwitch);
  }
  function buzz(p) {
    if (!settings.haptics) return;
    if (canVibrate) { try { navigator.vibrate(p); } catch {} return; }
    // Turn the pattern into taps: one at the start of each "on" segment, more every 70ms for long ones.
    const pat = Array.isArray(p) ? p : [p];
    let t = 0;
    for (let i = 0; i < pat.length; i += 2) {
      for (let d = 0; d < pat[i] && d < 280; d += 70) setTimeout(() => { try { iosSwitch.click(); } catch {} }, t + d);
      t += pat[i] + (pat[i + 1] || 0);
    }
  }

  // ---------- state ----------
  const fingers = new Map();   // id -> finger
  let dying = [], parts = [], shocks = [];
  let ghosts = [];   // lifted fingers that keep showing the result until the next tap
  let state = 'idle';          // idle | waiting | spinning | result
  let lastChange = 0, resultAt = -1e9, bg = null, mouseSeq = 0, spin = null;
  let beatIdx = 0, lastBeatAt = -1e9, flashAt = -1e9, shakeAt = -1e9;

  function pickHue() {
    const used = [...fingers.values()].map(f => f.baseHue);
    let best = [], bestD = -1;
    for (let i = 0; i < 24; i++) {
      const h = i * 15; let d = 360;
      for (const u of used) { const x = Math.abs(h - u) % 360; d = Math.min(d, x, 360 - x); }
      if (d > bestD) { best = [h]; bestD = d; } else if (d === bestD) best.push(h);
    }
    return best[rand(best.length)];
  }

  function addFinger(id, x, y, mouse) {
    if (state === 'result') clearResult();
    const h = pickHue();
    fingers.set(id, { id, x, y, baseHue: h, hue: h, born: performance.now(), phase: Math.random() * 6.28,
      mouse, win: null, rank: null, team: null, spinLabel: null });
    if (!mouse) buzz(12);
    changed();
  }
  function removeFinger(id) {
    const f = fingers.get(id); if (!f) return;
    fingers.delete(id);
    if (state === 'result') {
      // Freeze the lifted finger where it was so everyone can still see the result.
      // It stays until someone touches the screen again (addFinger → clearResult).
      ghosts.push(f);
      updateUI();
      return;
    }
    f.diedAt = performance.now(); dying.push(f);
    changed();
  }
  function dropGhosts(fade) {
    const now = performance.now();
    for (const g of ghosts) { g.diedAt = now; g.fade = fade; dying.push(g); }
    ghosts = [];
  }
  // Any change before the result (finger added/lifted, settings) restarts the countdown and cancels a spin.
  function changed() {
    lastChange = performance.now();
    spin = null; beatIdx = 0;
    for (const f of fingers.values()) { f.hue = f.baseHue; f.spinLabel = null; }
    state = fingers.size ? 'waiting' : 'idle';
    updateUI();
  }
  function clearResult() {
    for (const f of fingers.values()) { f.win = f.rank = f.team = null; f.hue = f.baseHue; }
    dropGhosts(450);
    if (bg && !bg.fadeAt) { bg.fadeAt = performance.now(); bg.fadeDur = 500; }
    state = fingers.size ? 'waiting' : 'idle';
    lastChange = performance.now(); beatIdx = 0;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const r = new Uint32Array(1); crypto.getRandomValues(r);
      const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- spin: a slowing roulette before the reveal ----------
  function startSpin(now) {
    const all = [...fingers.values()];
    const order = shuffle(all.slice());           // the real, fair outcome is fixed here
    const times = []; let t = 0, d = 55;
    while (t < SPIN) { times.push(t); t += d; d *= 1.13; }
    spin = { start: now, times, end: t + 120, last: -1, order, cur: null, seq: null, hues: null };
    if (settings.mode === 'winner') {
      // Built backwards so it lands on the winner and never highlights the same finger twice in a row.
      const seq = new Array(times.length); seq[times.length - 1] = order[0];
      for (let i = times.length - 2; i >= 0; i--) {
        const opts = all.filter(f => f !== seq[i + 1]); seq[i] = opts[rand(opts.length)];
      }
      spin.seq = seq;
    } else if (settings.mode === 'teams') {
      const off = Math.random() * 360, n = count();
      spin.hues = Array.from({ length: n }, (_, i) => (off + i * 360 / n) % 360);
    }
    state = 'spinning';
    updateUI();
  }
  function stepSpin(now) {
    const el = now - spin.start;
    let i = spin.last;
    while (i + 1 < spin.times.length && el >= spin.times[i + 1]) i++;
    if (i !== spin.last) {
      spin.last = i;
      // Teams and order land directly on the real result at the final step, with no extra pause.
      if (settings.mode !== 'winner' && i === spin.times.length - 1) { reveal(now); return; }
      sfx.tick(i); buzz(14);
      if (settings.mode === 'winner') spin.cur = spin.seq[i];
      else if (settings.mode === 'teams') for (const f of fingers.values()) f.hue = spin.hues[rand(spin.hues.length)];
      else for (const f of fingers.values()) f.spinLabel = 1 + rand(fingers.size);
    }
    if (el >= spin.end) reveal(now);
  }

  // ---------- reveal ----------
  function reveal(now) {
    const arr = spin.order, n = count();
    bg = null;
    for (const f of arr) f.spinLabel = null;
    if (settings.mode === 'winner') {
      arr.forEach((f, i) => f.win = i < n);
      const winners = arr.slice(0, n);
      if (n === 1) bg = { x: winners[0].x, y: winners[0].y, hue: winners[0].baseHue, start: now };
      for (const f of winners) { burst(f.x, f.y, f.baseHue, n === 1 ? 170 : 90, 1.05); shocks.push({ x: f.x, y: f.y, at: now }); }
    } else if (settings.mode === 'teams') {
      arr.forEach((f, i) => { f.team = i % n; f.hue = spin.hues[f.team]; burst(f.x, f.y, f.hue, 34, .65); });
      for (const f of arr) shocks.push({ x: f.x, y: f.y, at: now, small: true });
    } else {
      arr.forEach((f, i) => { f.rank = i + 1; burst(f.x, f.y, f.baseHue, i === 0 ? 130 : 16, i === 0 ? .95 : .4); });
      shocks.push({ x: arr[0].x, y: arr[0].y, at: now });
    }
    spin = null; state = 'result'; resultAt = now; flashAt = now; shakeAt = now;
    sfx.fanfare(); buzz([90, 50, 90, 50, 320]);
    updateUI();
  }

  function burst(x, y, hue, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = power * (.3 + Math.random() * .7);
      const r = Math.random();
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * .3, life: 0, max: 1300 + Math.random() * 1000,
        color: r < .2 ? '#fff' : r < .35 ? 'hsl(48 100% 62%)' : `hsl(${(hue + (Math.random() - .5) * 70 + 360) % 360} 95% 62%)`,
        w: 5 + Math.random() * 7, h: 3 + Math.random() * 4, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .02 });
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);
  }

  // ---------- input ----------
  const fingerRadius = () => Math.max(36, Math.min(58, Math.min(W, H) * 0.1));

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    audioInit();
    if (e.pointerType === 'mouse') {
      if (e.button !== 0 || state === 'spinning') return;
      if (state === 'result') { clearResult(); updateUI(); return; }   // click = choose again
      const R = fingerRadius();
      for (const f of fingers.values()) {
        if (f.mouse && Math.hypot(f.x - e.clientX, f.y - e.clientY) < R * 1.2) { removeFinger(f.id); return; }
      }
      addFinger('m' + (++mouseSeq), e.clientX, e.clientY, true);
      return;
    }
    addFinger(e.pointerId, e.clientX, e.clientY, false);
  });
  canvas.addEventListener('pointermove', e => {
    const f = fingers.get(e.pointerId);
    if (f && !f.mouse) { f.x = e.clientX; f.y = e.clientY; }
  });
  const up = e => { if (e.pointerType !== 'mouse') removeFinger(e.pointerId); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) for (const f of [...fingers.values()]) if (!f.mouse) removeFinger(f.id);
  });

  // ---------- UI ----------
  const modeBtns = [...document.querySelectorAll('[data-mode]')];
  const stepper = $('#stepper'), num = $('#num'), minus = $('#minus'), plus = $('#plus');
  const clearBtn = $('#clear'), fsBtn = $('#fs'), sndBtn = $('#snd'), vibBtn = $('#vib');
  vibBtn.hidden = !isTouch;
  vibBtn.addEventListener('click', () => {
    settings.haptics = !settings.haptics; save();
    if (settings.haptics) buzz(40);
    updateUI();
  });

  function settingsChanged() {
    save();
    if (state === 'result') clearResult();
    if (fingers.size) changed(); else updateUI();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => { settings.mode = b.dataset.mode; settingsChanged(); }));
  minus.addEventListener('click', () => { const m = settings.mode; settings.counts[m] = clampInt(count() - 1, m === 'teams' ? 2 : 1, 8, 1); settingsChanged(); });
  plus.addEventListener('click', () => { const m = settings.mode; settings.counts[m] = clampInt(count() + 1, 1, 8, 1); settingsChanged(); });
  clearBtn.addEventListener('click', () => { for (const f of [...fingers.values()]) if (f.mouse) removeFinger(f.id); });
  sndBtn.addEventListener('click', () => {
    settings.sound = !settings.sound; save(); audioInit();
    if (settings.sound) tone(880, .08, 'triangle', .2);
    updateUI();
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') clearBtn.click();
    if ((e.key === ' ' || e.key === 'Enter') && state === 'result' && e.target === document.body) { clearResult(); updateUI(); }
  });

  if (document.fullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}));
  }

  function updateUI() {
    const m = settings.mode, n = count();
    modeBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === m)));
    stepper.hidden = m === 'order';
    num.textContent = m === 'winner' ? `${n} kazanan` : `${n} takım`;
    minus.disabled = n <= (m === 'teams' ? 2 : 1);
    plus.disabled = n >= 8;
    sndBtn.textContent = settings.sound ? 'Ses açık' : 'Ses kapalı';
    sndBtn.setAttribute('aria-pressed', String(settings.sound));
    vibBtn.textContent = settings.haptics ? 'Titreşim açık' : 'Titreşim kapalı';
    vibBtn.setAttribute('aria-pressed', String(settings.haptics));

    const live = [...fingers.values()];
    document.body.classList.toggle('busy', live.some(f => !f.mouse) || state === 'spinning' || ghosts.length > 0);
    clearBtn.hidden = !live.some(f => f.mouse);

    const need = minFingers();
    let title = '', sub = '', icon = false;
    if (state === 'idle' && fingers.size === 0) {
      icon = true;
      title = isTouch ? 'Herkes bir parmağını koysun' : 'Her oyuncu için bir kez tıkla';
      sub = m === 'winner' ? (n === 1 ? 'Kıpırdamayın — biriniz seçilecek' : `Kıpırdamayın — ${n} kişi seçilecek`)
          : m === 'teams' ? `Kıpırdamayın — ${n} takıma ayrılacaksınız`
          : 'Kıpırdamayın — herkes bir sıra alacak';
      if (!isTouch) sub += ' · en iyi telefonda çalışır';
    } else if (state === 'waiting' && fingers.size < need) {
      sub = `${need - fingers.size} oyuncu daha gerekli`;
    } else if (state === 'result' && !live.some(f => !f.mouse) && ghosts.length === 0) {
      sub = 'Yeniden seçmek için herhangi bir yere tıkla';
    }
    tapHint.classList.toggle('show', state === 'result' && ghosts.length > 0 && fingers.size === 0);
    hintTitle.textContent = title; hintSub.textContent = sub;
    hint.classList.toggle('off', !title && !sub);
    hint.classList.toggle('hide-icon', !icon);
  }

  // ---------- drawing ----------
  const ease = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };

  let prog = 0, beatKick = 0;

  function drawFinger(f, now, R, k) {
    let s = easeOutBack(Math.min(1, (now - f.born) / 380)) * k;
    const rt = ease(Math.min(1, (now - resultAt) / 450));
    if (f.win === false) { s *= 1 - rt; if (s <= 0.01) return; }
    if (f.win === true) s *= 1 + 0.3 * rt;
    s *= 1 + beatKick;

    let x = f.x, y = f.y, alpha = 1;
    if (prog > 0 && k === 1 && !reduceMotion) {         // tension: fingers tremble harder as the ring closes
      const j = prog * prog * 6; x += (Math.random() - .5) * j; y += (Math.random() - .5) * j;
    }
    const spot = state === 'spinning' && settings.mode === 'winner' && k === 1;
    const lit = spot && spin.cur === f;
    if (spot) { if (lit) s *= 1.25; else alpha = .35; }

    const r = R * s * (1 + 0.05 * Math.sin(now / 170 + f.phase));
    const hue = f.hue;
    ctx.globalAlpha = alpha;

    if (lit) { ctx.fillStyle = `hsla(${hue} 100% 70% / .35)`; circle(x, y, r * 2); ctx.fill(); }
    ctx.fillStyle = `hsla(${hue} 90% 60% / .16)`; circle(x, y, r * 1.5); ctx.fill();
    ctx.fillStyle = `hsl(${hue} 88% 56%)`; circle(x, y, r); ctx.fill();
    ctx.lineWidth = Math.max(3, r * 0.09); ctx.strokeStyle = `hsl(${hue} 95% 74%)`; circle(x, y, r * 1.18); ctx.stroke();

    if (prog > 0 && k === 1) {
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath(); ctx.arc(x, y, r * 1.5, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); ctx.stroke();
    }
    if (lit) { ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; circle(x, y, r * 1.18); ctx.stroke(); }
    if (f.win === true) {
      const rp = ((now - resultAt) % 1300) / 1300;
      ctx.lineWidth = 5 * (1 - rp); ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - rp)})`;
      circle(x, y, r * (1.25 + rp * 1.6)); ctx.stroke();
      ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; circle(x, y, r * 1.18); ctx.stroke();
    }
    const label = f.spinLabel ?? f.rank ?? (f.team != null ? f.team + 1 : null);
    if (label != null) {
      ctx.save();
      // Final labels pop in right away instead of fading in slowly.
      const pop = f.spinLabel != null ? 1 : easeOutBack(Math.min(1, (now - resultAt) / 260));
      ctx.globalAlpha = alpha * (f.spinLabel != null ? .8 : k);
      ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8;
      ctx.font = `800 ${Math.max(1, Math.round(r * 0.95 * pop))}px ui-rounded, system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(label), x, y + r * 0.05);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;

    const counting = state === 'waiting' && fingers.size >= minFingers();
    const raw = counting ? (now - lastChange - HOLD) / COUNT : -1;
    prog = Math.max(0, Math.min(1, raw));
    if (raw >= 0) {
      while (beatIdx < BEATS.length && raw >= BEATS[beatIdx]) { beatIdx++; lastBeatAt = now; sfx.beat(raw); buzz(Math.round(20 + raw * 40)); }
      if (raw >= 1) { startSpin(now); prog = 0; }
    }
    if (state === 'spinning') stepSpin(now);    beatKick = counting ? .14 * Math.exp(-(now - lastBeatAt) / 110) : 0;

    ctx.save();
    const st = (now - shakeAt) / 550;
    if (!reduceMotion && st < 1) { const a = 16 * (1 - st) ** 2; ctx.translate((Math.random() - .5) * 2 * a, (Math.random() - .5) * 2 * a); }
    ctx.fillStyle = '#0b0b10'; ctx.fillRect(-40, -40, W + 80, H + 80);

    if (bg) {
      let a = 1;
      if (bg.fadeAt) { a = 1 - (now - bg.fadeAt) / (bg.fadeDur || 450); if (a <= 0) bg = null; }
      if (bg) {
        const t = ease(Math.min(1, (now - bg.start) / 650));
        const maxR = Math.hypot(Math.max(bg.x, W - bg.x), Math.max(bg.y, H - bg.y)) + 40;
        ctx.globalAlpha = a; ctx.fillStyle = `hsl(${bg.hue} 70% 36%)`;
        circle(bg.x, bg.y, maxR * t); ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    // darkening vignette while tension builds
    const v = state === 'spinning' ? .65 : prog * .65;
    if (v > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .2, W / 2, H / 2, Math.hypot(W, H) / 2);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${v})`);
      ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
    }

    shocks = shocks.filter(s => now - s.at < 800);
    for (const s of shocks) {
      const t = (now - s.at) / 800, maxR = s.small ? Math.min(W, H) * .35 : Math.hypot(W, H) * .7;
      ctx.lineWidth = (s.small ? 6 : 16) * (1 - t); ctx.strokeStyle = `rgba(255,255,255,${.75 * (1 - t)})`;
      circle(s.x, s.y, ease(t) * maxR); ctx.stroke();
    }

    const R = fingerRadius();
    dying = dying.filter(f => now - f.diedAt < (f.fade || 320));
    for (const f of dying) drawFinger(f, now, R, 1 - ease((now - f.diedAt) / (f.fade || 320)));
    for (const f of ghosts) drawFinger(f, now, R, 1);
    for (const f of fingers.values()) drawFinger(f, now, R, 1);

    // confetti
    if (parts.length) {
      const drag = Math.pow(.985, dt / 16);
      parts = parts.filter(p => (p.life += dt) < p.max);
      for (const p of parts) {
        p.vx *= drag; p.vy = p.vy * drag + .0011 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.globalAlpha = Math.min(1, 2.5 * (1 - p.life / p.max));
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2.3));
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    ctx.restore();

    // white flash on reveal
    const ft = (now - flashAt) / 300;
    if (ft < 1) { ctx.fillStyle = `rgba(255,255,255,${(reduceMotion ? .25 : .75) * (1 - ft) ** 2})`; ctx.fillRect(0, 0, W, H); }

    requestAnimationFrame(frame);
  }

  updateUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
